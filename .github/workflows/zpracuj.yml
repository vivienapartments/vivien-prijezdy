# Zaloha: rucni spusteni. Pravidelny budik = cron-job.org (kazde 2 minuty).
name: Zpracuj schranku

on:
  workflow_dispatch:

jobs:
  zpracuj:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /api/zpracuj
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRUVODCE_URL: https://vivien-prijezdy-six.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Chybi GitHub secret CRON_SECRET"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 90 \
            "${PRUVODCE_URL}/api/zpracuj"
